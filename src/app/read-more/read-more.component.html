<div class="service-details-container">
    <header class="hero-section" @fadeIn>
        <h1>Our Services</h1>
        <p>Discover our range of professional customization solutions</p>
    </header>

    <section class="services-grid">
        <div class="service-card" *ngFor="let service of services" @fadeIn>
            <div class="service-image">
                <img [src]="service.image" [alt]="service.title">
            </div>
            <div class="service-content">
                <h2>{{service.title}}</h2>
                <p>{{service.description}}</p>
                <ul class="features-list">
                    <li *ngFor="let feature of service.features">{{feature}}</li>
                </ul>
                <button class="learn-more">Learn More</button>
            </div>
        </div>
    </section>

    <button routerLink="/quote/quickQuote" class="quote-button" >Get a quote</button>
</div>
